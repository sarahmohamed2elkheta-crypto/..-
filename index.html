<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ساعة الحسم | SAAT EL HASM</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7041B8;--d:#45236F;--l:#F0E8FC;--g:#E7BD67;--ok:#54A887;--bad:#c2495b;--bg:#F8F5FC;--card:#fff;--tx:#2a1846;--mut:#6e6285;--bd:#e4d8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1126;--card:#251838;--tx:#f1eafb;--mut:#b5a6cf;--bd:#3b2a57;--l:#33224d}}
:root[data-theme="dark"]{--bg:#1a1126;--card:#251838;--tx:#f1eafb;--mut:#b5a6cf;--bd:#3b2a57;--l:#33224d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,var(--p),var(--d));color:#fff;padding:14px 16px}header b{font-size:20px}header small{opacity:.85;display:block}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer}nav button.on{background:var(--p);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
h2{margin:6px 0 4px;color:var(--p)}.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(112,65,184,.08);margin-bottom:12px}
.stat b{font-size:26px;color:var(--p);display:block}.stat span{color:var(--mut);font-size:14px}
.btn{border:0;background:var(--p);color:#fff;font:inherit;font-weight:700;padding:11px 18px;border-radius:14px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);background:var(--d)}
.btn.s{background:var(--l);color:var(--p)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-weight:700;margin:12px 0 4px}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}textarea{min-height:76px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--l);color:var(--p);font-size:13px;font-weight:700}
.cd{background:linear-gradient(135deg,var(--p),var(--d));color:#fff;border-radius:24px;padding:34px 20px;text-align:center}.th{max-width:100%;max-height:220px;border-radius:12px;cursor:zoom-in;display:block;margin:8px 0}.prog{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.prog span{padding:5px 12px;border-radius:20px;background:var(--l);color:var(--mut);font-size:13px}.prog .on{background:var(--p);color:#fff}.cd .t{font-size:clamp(48px,15vw,88px);font-weight:800;direction:ltr;letter-spacing:2px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border:2px solid var(--l);border-radius:18px;padding:12px}
.cmp img{width:100%;border-radius:12px;cursor:zoom-in;max-height:360px;object-fit:contain;background:var(--l)}.cmp small{color:var(--mut);display:block;text-align:center}.cmp b{display:block;text-align:center;color:var(--p)}
.vs{background:var(--g);color:#3a2a00;font-weight:800;border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
@media(max-width:640px){.cmp{grid-template-columns:1fr}.vs{margin:auto}}
.up{border:2px dashed var(--p);border-radius:16px;padding:14px;background:var(--l)}.up img{max-width:100%;max-height:220px;border-radius:12px;display:block;margin-top:8px}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:14px 0}.pod div{flex:1;max-width:170px;text-align:center;border-radius:16px 16px 0 0;color:#fff;padding:10px 6px;background:var(--p)}
.pod .a{height:150px;background:linear-gradient(var(--g),#b8892e)}.pod .b{height:120px}.pod .c{height:100px;background:var(--d)}
.err{background:#fde8ec;color:#8a2336;padding:10px;border-radius:12px;margin:10px 0}.okm{background:#e3f5ec;color:#1d6b4b;padding:10px;border-radius:12px;margin:10px 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:50;cursor:zoom-out}#lb img{max-width:94vw;max-height:90vh}
footer{text-align:center;color:var(--mut);padding:20px;font-size:14px}
.cmp{grid-template-columns:1fr 1fr;border:0;padding:0;gap:14px;align-items:stretch;margin-bottom:12px}.pc{background:var(--l);border-radius:20px;padding:12px;position:relative}.pc img{width:100%;border-radius:14px;max-height:none;aspect-ratio:4/3;object-fit:contain;background:var(--card);display:block}.pc b{color:var(--p);font-size:18px;margin-top:10px;text-align:right}.pc small{text-align:right;color:var(--mut)}.bd{position:absolute;top:20px;right:20px;z-index:2;padding:3px 14px;border-radius:20px;font-weight:800;font-size:14px}.bd.b{background:#d9c8f5;color:#5b2fa0}.bd.a{background:#cdeedd;color:#1d8a52}.st{display:inline-block;padding:4px 14px;border-radius:20px;background:#ffe3d4;color:#c4521a;font-weight:700}.st.ap{background:#e3f5ec;color:#1d6b4b}.flow{font-size:20px;font-weight:700;color:var(--p);margin:6px 0 10px}@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.tag{position:absolute;top:14px;left:18px;font-size:12px;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:10px}.hb{font-size:28px;font-weight:800;margin-top:14px}.tl{font-size:17px;font-weight:700;margin:4px 0}.sg{font-size:13px;opacity:.9;margin-top:10px;font-weight:700}
header{position:relative;margin:12px auto 0;width:calc(100% - 24px);max-width:720px;border-radius:22px;padding:18px 20px;background:linear-gradient(135deg,#7a49c2,#5b2fa0)}nav{max-width:720px;width:calc(100% - 24px);margin:12px auto 0;border-radius:18px;border:1px solid var(--bd)}main{max-width:720px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--l);border-radius:18px;padding:14px}.tile b{display:block;font-size:18px;color:var(--tx)}.big{font-size:28px;font-weight:800;color:var(--p)}
input,select{border-radius:22px}.blk{width:100%;background:#16101f;color:#fff;border:1px solid var(--bd);border-radius:24px;padding:14px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}.hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
.tpr{direction:ltr;flex-wrap:nowrap;gap:4px;margin-top:6px}.tpr select{min-width:0;flex:1;padding:10px 4px}
</style></head><body>
<header><span class="tag">EL KHETA • 2027</span><div class="hb">ساعة الحسم</div><div class="tl">وقتك. هدفك. إنجازك. 🏆</div><div>كل اتفاق بتحدده لنفسك هو فرصة جديدة تكون بطل الأسبوع.</div><div class="sg">مس سارة | أبطال تالتة إعدادي</div><small id="who" style="display:none"></small></header><nav id="nav"></nav><main id="app"><div class="card">جاري التحميل…</div></main>
<footer>Miss Sara Mohamed 💜<br>El Kheta Educational Platform</footer><div id="lb"><img alt=""></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pv=false,me,adm,db,AS,DLD,ag={},rv={},wk={min:3,winners:null},V='home',P=null,F={},G={},msg='';
const SUB=['عربي','إنجليزي','رياضيات','علوم','دراسات اجتماعية'],TT=['مشاهدة حصة','حل واجب','امتحان','مراجعة درس','تصفية متأخرات','مهمة مخصصة'];
const DL={approved:'معتمد ✅',partial:'تحقق جزئي 📚',needs_shot:'محتاج سكرين جديدة 📸',needs_clarif:'محتاج توضيح 💬',rejected:'مرفوض',reopened:'اتفتح من جديد 🔓'};
const TZ='Africa/Cairo',fm=t=>t?new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short',timeZone:TZ}):'—',img=id=>'/_blob/'+id;
const off=t=>{const p={};new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(t).forEach(x=>p[x.type]=x.value);return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-t};
const c2ms=s=>{const[d,t]=s.split('T'),[y,m,da]=d.split('-'),[h,mi]=t.split(':'),g=Date.UTC(y,m-1,da,h,mi);let r=g-off(g);return g-off(r)};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const tms=p=>{let h=(+(F[p+'h']||4))%12;if((F[p+'a']||'م')==='م')h+=12;return c2ms((F[p+'d']||today())+'T'+String(h).padStart(2,'0')+':'+(F[p+'m']||'00'))};
const tp=p=>{const h=F[p+'h']||'4',m=F[p+'m']||'00',ap=F[p+'a']||'م',d=F[p+'d']||today(),o=(a,v)=>a.map(x=>`<option ${v==x?'selected':''}>${x}</option>`).join('');
return`<input type="date" data-k="${p}d" value="${d}" min="${today()}"><div class="row tpr"><select data-k="${p}h">${o(Array.from({length:12},(_,i)=>i+1),h)}</select><b>:</b><select data-k="${p}m">${o(['00','05','10','15','20','25','30','35','40','45','50','55'],m)}</select><select data-k="${p}a">${o(['ص','م'],ap)}</select></div>`};
const pend=a=>a.submittedAt&&(!rv[a.id]||rv[a.id].at<a.submittedAt);
const reop=a=>rv[a.id]&&rv[a.id].at>=a.submittedAt&&['reopened','needs_shot','needs_clarif'].includes(rv[a.id].decision);
const locked=a=>a.submittedAt&&!reop(a);
const apr=a=>a.submittedAt&&!pend(a)&&rv[a.id].decision==='approved';
const st=a=>{if(a.cancelled)return'ملغي';if(a.submittedAt)return pend(a)?'في انتظار الاعتماد ⏳':DL[rv[a.id].decision];const n=Date.now();if(a.startedAt)return n<a.checkin?'جاري 🔥':'في انتظار الـ Check-in 👀';return n<a.start?'قادم':n<a.checkin?'جاهز تبدأ 🚀':'في انتظار الـ Check-in 👀'};
const ws=()=>{const[y,m,d]=today().split('-').map(Number),w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return c2ms(new Date(Date.UTC(y,m-1,d-((w+1)%7))).toISOString().slice(0,10)+'T00:00')};
const all=()=>Object.values(ag).sort((x,y)=>y.start-x.start),mine=()=>all().filter(a=>a.sid===me.id);
const cnt=sid=>all().filter(a=>a.sid===sid&&apr(a)&&a.checkin>=ws()).length;
const studs=()=>{const m={};all().forEach(a=>m[a.sid]=a.sname);return Object.entries(m).map(([id,n])=>({id,n,c:cnt(id)}))};
const cd=ms=>{ms=Math.max(0,ms);const p=n=>String(n).padStart(2,'0');return p(Math.floor(ms/36e5))+':'+p(Math.floor(ms/6e4)%60)+':'+p(Math.floor(ms/1e3)%60)};
const cmp=a=>{const r=rv[a.id],pd=pend(a),lb=!a.submittedAt?'لسه متسلّمش':pd?'في انتظار المراجعة':DL[r.decision],cl=!a.submittedAt||pd?'':r.decision==='approved'?'ap':'';
return`<div class="card"><b>${esc(a.subject)} · ${esc(a.type)}</b><div>${a.lesson?esc(a.lesson)+' — ':''}${esc(a.goal)}</div><small>البداية المتفق عليها: ${fm(a.start)} · البداية الفعلية: ${a.startedAt?fm(a.startedAt):'مسجلتش'} · الـ Check-in: ${fm(a.checkin)} · التسليم: ${fm(a.submittedAt)}</small></div>
<div class="cmp"><div class="pc"><span class="bd b">BEFORE</span><img data-a="zoom" src="${img(a.beforeId)}" alt="قبل"><b>قبل الإنجاز</b><small>سكرين الحصة قبل البداية</small><small>${fm(a.beforeAt)}</small></div>
<div class="pc"><span class="bd a">AFTER</span>${a.afterId?`<img data-a="zoom" src="${img(a.afterId)}" alt="بعد">`:'<div class="up" style="min-height:140px">لسه مفيش صورة</div>'}<b>بعد الإنجاز</b><small>سكرين الحصة بعد الانتهاء</small><small>${fm(a.afterAt)}</small></div></div>
<div class="card res"><h3 style="margin:0 0 6px">🏆 النتيجة</h3><div class="flow">قبل البداية ← بعد الإنجاز ← اعتماد مس سارة</div><span class="st ${cl}">${lb}</span></div>`};
const T=adm?[['dash','لوحة التحكم'],['rev','مراجعة إنجازات الأبطال'],['agr','الاتفاقات'],['stu','الطلاب'],['wk','بطل الأسبوع']]:[['home','الرئيسية'],['mine','إنجازاتي 🏆'],['board','بطل الأسبوع']];
function R(){const t=adm&&!pv?[['dash','لوحة التحكم'],['rev','مراجعة إنجازات الأبطال'],['agr','الاتفاقات'],['stu','الطلاب'],['wk','بطل الأسبوع']]:[['home','الرئيسية'],['mine','إنجازاتي 🏆'],['board','بطل الأسبوع']];
$('#nav').innerHTML=t.map(([k,n])=>`<button data-a="go" data-v="${k}" class="${V===k?'on':''}">${n}</button>`).join('');
const m=msg?`<div class="${msg[0]==='!'?'err':'okm'}">${esc(msg.slice(1))}</div>`:'';msg='';$('#app').innerHTML=m+(adm?sw():'')+(PG[V]?PG[V]():'');}
const chip=a=>`<span class="chip">${st(a)}</span>`;
const board=()=>{const w=wk.winners;if(!w)return'<div class="card">الأبطال هيتعلنوا قريب بعد اعتماد مس سارة 💜</div>';const t=w.slice(0,3);return`<div class="pod">${[1,0,2].filter(i=>t[i]).map(i=>`<div class="${'abc'[i]}"><div style="background:none;padding:0;font-size:28px">${['🥇','🥈','🥉'][i]}</div><b>${esc(t[i].n)}</b><br>${t[i].c} مهمة معتمدة</div>`).join('')}</div>
<div class="card"><h3>أبطال ساعة الحسم 🏆</h3>${w.map(x=>`<span class="chip" style="margin:3px">${esc(x.n)} · ${x.c}</span>`).join('')||'—'}</div>`};
const prog=a=>{const d=[1,!!a.startedAt,!!a.submittedAt,!!a.submittedAt,apr(a)],n=['تم الاتفاق','بدأت المذاكرة','رفعت الإنجاز','مراجعة مس سارة','تم الاعتماد'];return`<div class="prog">${n.map((t,i)=>`<span class="${d[i]?'on':''}">${i+1}. ${t}</span>`).join('')}</div>`};
const hero=a=>{const n=Date.now(),sub=a.submittedAt;let t;
if(a.cancelled)t='<div class="cd">الاتفاق ده اتلغى</div>';
else if(sub)t=`<div class="cd"><div style="font-size:22px">${pend(a)?'نتيجتك وصلت لمس سارة، مستنيين الاعتماد 💜':st(a)}</div></div>`;
else if(a.startedAt)t=`<div class="cd">جلسة المذاكرة شغالة 🔥<div class="t" id="cd" data-k="c" data-t="${a.checkin}">${cd(a.checkin-n)}</div><div>الوقت المتبقي لموعد التسليم: ${fm(a.checkin)}</div><div>مدة الجلسة: <b id="el" data-s="${a.startedAt}">${cd(n-a.startedAt)}</b></div>${n>=a.checkin?'<div>ميعاد التسليم عدّى، ممكن تسلّم دلوقتي وإنجازك لسه محسوب 💜</div>':''}</div>`;
else if(n<a.start)t=`<div class="cd">الوقت بيقرب... جاهز تحقق هدفك؟ ⏰<div class="t" id="cd" data-k="s" data-t="${a.start}">${cd(a.start-n)}</div><div>للبداية المتفق عليها: ${fm(a.start)}</div></div>`;
else t=`<div class="cd">ميعاد البداية جه! ⏰<div><button class="btn ok" style="font-size:22px;margin:14px 0" data-a="begin" data-id="${a.id}">بدأت المذاكرة 🚀</button></div><small>الموعد المتفق عليه: ${fm(a.start)}</small></div>`;
const ok=!a.cancelled&&(!sub||reop(a))&&(a.startedAt||n>=a.checkin);
return t+`<div class="card" style="margin-top:12px"><b>${esc(a.subject)} · ${esc(a.type)}</b> ${chip(a)}<br>المهمة: ${esc(a.goal)}<br><small>وقت البداية: ${fm(a.start)} · موعد تسليم الإنجاز: ${fm(a.checkin)}</small>${a.startedAt?`<br><small>بدأت فعليًا: ${fm(a.startedAt)}</small>`:''}</div>${prog(a)}
<div class="grid"><div class="card"><b>📍 قبل المذاكرة</b><img class="th" data-a="zoom" src="${img(a.beforeId)}" alt="قبل"><small>${fm(a.beforeAt)}</small></div><div class="card"><b>🏆 بعد المذاكرة</b>${a.afterId?`<img class="th" data-a="zoom" src="${img(a.afterId)}" alt="بعد"><small>${fm(a.afterAt)}</small>`:'<div>لسه مفيش إنجاز مرفوع</div>'}${ok?`<br><button class="btn" data-a="go" data-v="checkin" data-id="${a.id}">ارفع إنجازك</button>`:''}</div></div>${!sub&&!a.cancelled&&n<a.start?`<button class="btn bad" data-a="cancel" data-id="${a.id}">إلغاء الاتفاق</button>`:''}`};
const nav2=(s,l)=>`<div class="row" style="margin-top:14px">${s>1?'<button class="btn s" data-a="back">→ رجوع</button>':''}<button class="btn ${l?'ok':''}" data-a="${l?'save':'next'}">${l?'تم الاتفاق! 🚀':'كمّل ←'}</button></div>`;
const sw=()=>`<div class="card"><small style="color:var(--p);font-weight:700">معاينة الموقع – اختاري طريقة العرض</small><div class="row" style="margin-top:8px;flex-wrap:nowrap"><button class="btn ${pv?'':'s'}" style="flex:1" data-a="vw" data-v="stu">🎓 الطالب</button><button class="btn ${pv?'s':''}" style="flex:1" data-a="vw" data-v="adm">👩‍🏫 مس سارة</button></div></div>`;
const frm=()=>{if(F.confirm)return`<div class="card"><h3 style="margin:0 0 8px">اتفاق ساعة الحسم 💜</h3><p>👤 <b>${esc(me.name)}</b></p><p>📚 ${esc(F.subject||SUB[0])}<br>${esc(F.goal)}</p><b>📸 صورة قبل الإنجاز</b><img class="th" src="${img(F.before.id)}" alt=""><p>⏰ ساعة البداية: <b>${fm(F.start)}</b><br>🏁 ساعة الحسم (Check-in): <b>${fm(F.checkin)}</b></p><small>بعد التأكيد، ميعاد البداية بيتثبّت.</small><div class="row" style="margin-top:14px"><button class="btn s" data-a="back">→ تعديل</button><button class="btn ok" data-a="save">تم الاتفاق! 🚀</button></div></div>`;
return`<div class="card"><h3 style="margin:0 0 4px">اتفاق المهمة الجديدة</h3><p class="sub" style="margin:0">⏰ هتبدأ مذاكرة الساعة كام؟ اختار ميعاد مناسب ليك، وخليك جاهز تلتزم باتفاقك. (بتوقيت القاهرة)</p><hr class="hr">
<div class="tiles"><div><label>وقت البداية</label>${tp('s')}</div><div><label>ميعاد المتابعة</label>${tp('c')}</div></div>
<label>اسمي</label><input value="${esc(me.name)}" readonly><label>المادة</label><select data-k="subject">${SUB.map(x=>`<option ${F.subject===x?'selected':''}>${x}</option>`).join('')}</select>
<label>المهمة اللي هتنجزها</label><textarea data-k="goal" placeholder="مثال: إنهاء حصة التيار الكهربي وحل الواجب">${esc(F.goal||'')}</textarea>
<label>📸 قبل ما تبدأ</label><div class="up"><div>ارفع سكرين توضح حالة الحصة أو المهمة قبل ما تبدأ، عشان نقدر نقارن إنجازك بعد ما تخلص.</div><input type="file" accept="image/*" id="fb">${F.before?`<img src="${img(F.before.id)}" alt="معاينة"><small>${fm(F.before.at)} — ممكن تستبدلها بصورة تانية</small>`:''}</div>
<button class="blk" data-a="next">🚀 سجّل اتفاقك</button></div>`};
const PG={
home(){const a=mine(),c=a.filter(x=>!x.cancelled&&!x.submittedAt).sort((x,y)=>x.start-y.start)[0]||a.find(x=>x.submittedAt&&(pend(x)||reop(x))),ap=cnt(me.id),td=a.filter(x=>!x.cancelled&&new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(x.start)===today()).length,nt=a.filter(x=>x.submittedAt&&!pend(x)).slice(0,3),fn=(me.name||'').split(' ')[0];
return`<div class="card"><h2 style="margin:0">أهلاً يا ${esc(fn)}! 💜</h2><p class="sub" style="margin:2px 0 12px">جاهز تحدد مهمتك النهارده؟</p><div class="tiles"><div class="tile">🎯<b>هدفك اليوم</b><span class="big">${td}</span></div><div class="tile">🏆<b>بطل الأسبوع</b><span style="color:var(--mut)">${ap>=wk.min?'متأهل ✅ بعد تأكيد مس سارة':ap+' من '+wk.min+' معتمدة'}</span></div></div><div class="row" style="margin-top:10px"><button class="btn s" data-a="go" data-v="mine">شوف إنجازاتي 🏆</button></div></div>
${c?hero(c):''}${nt.map(x=>`<div class="card">${rv[x.id].decision==='approved'?'تم اعتماد إنجازك 🏆':['needs_clarif','needs_shot'].includes(rv[x.id].decision)?'مس سارة محتاجة توضيح أو سكرين إضافية 💬':'اتراجعت نتيجتك: '+DL[rv[x.id].decision]} — ${esc(x.goal.slice(0,40))}</div>`).join('')}${frm()}
<div class="card"><h3 style="margin:0 0 4px">🏆 بطل الأسبوع</h3><p class="sub" style="margin:0 0 8px">قائمة المتأهلين بعد اعتماد مس سارة للإنجاز</p>${wk.winners&&wk.winners.length?wk.winners.map(x=>`<span class="chip" style="margin:3px">${esc(x.n)} · ${x.c}</span>`).join(''):'لسه مستنيين أول إنجاز معتمد 👀'}</div>`},
new(){return PG.home()},
mission(){const a=ag[P];return a?'<h2>مهمتي</h2>'+hero(a):''},
checkin(){const a=ag[P];if(!a)return'';if(locked(a))return`<h2>نتيجتك وصلت لمس سارة، مستنيين الاعتماد 💜</h2>${cmp(a)}`;
const ex=reop(a)?`<div class="err">مس سارة طلبت: ${esc(rv[a.id].notes||DL[rv[a.id].decision])}</div>`:'';
return`<h2>ساعة الحسم وصلت! 👀</h2>${ex}<p class="sub">وصلت لفين في الهدف اللي اتفقنا عليه؟</p><div class="card"><b>${esc(a.goal)}</b>
${[['full','حققت الهدف بالكامل 🎯'],['part','حققت جزء من الهدف 📚'],['more','محتاج وقت إضافي ⏳']].map(([v,t])=>`<label style="font-weight:500"><input type="radio" name="r" style="width:auto" data-k="result" value="${v}" ${F.result===v?'checked':''}> ${t}</label>`).join('')}
<label>شاركني وصلت لفين 👀</label><textarea data-k="snotes">${esc(F.snotes||'')}</textarea>
<label>🏆 ورينا وصلت لفين</label><div class="up"><div>دلوقتي دورك تورينا الفرق بين قبل وبعد 👀 ارفع سكرين توضح إنجازك بعد ما خلصت المهمة.</div><div style="margin:8px 0"><small>قبل (للمقارنة):</small><br><img src="${img(a.beforeId)}" style="max-height:80px;border-radius:8px;display:inline" alt=""></div><input type="file" accept="image/*" id="fa">${F.after?`<img src="${img(F.after.id)}" alt="معاينة"><small>${fm(F.after.at)}</small>`:''}</div>
<div style="margin-top:14px"><button class="btn" data-a="submit" data-id="${a.id}">إرسال الإنجاز لمس سارة 💜</button></div></div>`},
mine(){const a=mine();return`<h2>إنجازاتي 🏆</h2><p class="sub">معتمد هذا الأسبوع: ${cnt(me.id)}</p>${a.map(x=>`<div class="card"><div class="row"><b>${esc(x.subject)}</b>${chip(x)}<button class="btn s" data-a="go" data-v="mission" data-id="${x.id}">فتح</button></div><p>${esc(x.goal)}</p>${rv[x.id]&&rv[x.id].notes&&!pend(x)?`<div class="okm">من مس سارة: ${esc(rv[x.id].notes)}</div>`:''}${x.afterId?cmp(x):''}</div>`).join('')||'<div class="card">لسه مفيش اتفاقات.</div>'}`},
board(){return`<h2>🏆 بطل الأسبوع</h2><p class="sub">كل اتفاق حققته هو خطوة جديدة ناحية إنجازك.</p>${board()}<div class="card">المهام المعتمدة ليك هذا الأسبوع: <b>${cnt(me.id)}</b> (المطلوب ${wk.min})</div>`},
dash(){const a=all(),n=Date.now();const c=(f)=>a.filter(f).length;return`<h2>عندك إنجازات مستنية مراجعتك.</h2><div class="grid">${[['إجمالي الطلاب',studs().length],['الاتفاقات النشطة',c(x=>!x.cancelled&&!x.submittedAt)],['في انتظار الـ Check-in',c(x=>!x.cancelled&&!x.submittedAt&&n>=x.checkin)],['النتائج في انتظار الاعتماد',c(pend)],['الإنجازات المعتمدة',c(apr)],['المتأهلون لبطل الأسبوع',studs().filter(s=>s.c>=wk.min).length]].map(([t,v])=>`<div class="card stat"><span>${t}</span><b>${v}</b></div>`).join('')}</div><button class="btn" data-a="csv">تصدير CSV 📄</button><h3>إشعارات</h3>${all().filter(x=>!x.cancelled).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0)).slice(0,6).map(x=>`<div class="card">اتفاق جديد من <b>${esc(x.sname)}</b> — ${esc(x.subject)}، بداية ${fm(x.start)}${x.startedAt?`، بدأ فعليًا ${fm(x.startedAt)}`:''}، Check-in ${fm(x.checkin)}</div>`).join('')}`},
rev(){const p=all().filter(pend);return`<h2>مراجعة إنجازات الأبطال</h2>${p.map(a=>`<div class="card"><b>${esc(a.sname)}</b> · نتيجة الطالب: ${{full:'حقق الهدف بالكامل',part:'حقق جزء',more:'محتاج وقت'}[a.result]}<br>${esc(a.snotes||'')}${cmp(a)}
<label>ملاحظات للطالب</label><textarea id="n${a.id}"></textarea><div class="row" style="margin-top:8px"><button class="btn ok" data-a="dec" data-d="approved" data-id="${a.id}">اعتماد</button><button class="btn s" data-a="dec" data-d="partial" data-id="${a.id}">تحقق جزئي</button><button class="btn s" data-a="dec" data-d="needs_shot" data-id="${a.id}">اطلب سكرين تانية</button><button class="btn s" data-a="dec" data-d="needs_clarif" data-id="${a.id}">اطلب توضيح</button><button class="btn bad" data-a="dec" data-d="rejected" data-id="${a.id}">رفض</button></div></div>`).join('')||'<div class="card">مفيش نتايج مستنية دلوقتي 💜</div>'}`},
agr(){return`<h2>الاتفاقات</h2><div class="row"><input data-f="q" placeholder="ابحث باسم الطالب" style="max-width:260px"><select data-f="s" style="max-width:220px"><option value="">كل الحالات</option>${['قادم','جاري','انتظار الـ Check-in','انتظار الاعتماد','معتمد','مرفوض','ملغي'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="lst">${agList()}</div>`},
stu(){return`<h2>الطلاب</h2><input data-f="q2" placeholder="ابحث باسم الطالب" style="max-width:260px"><div id="lst">${stuList()}</div>`},
wk(){const s=studs().sort((x,y)=>y.c-x.c);return`<h2>بطل الأسبوع</h2><div class="card"><label>الحد الأدنى للمهام المعتمدة للتأهل</label><div class="row"><input type="number" id="min" min="1" value="${wk.min}" style="max-width:100px"><button class="btn s" data-a="min">حفظ</button></div></div>
<div class="card">${s.map(x=>`<label style="font-weight:500"><input type="checkbox" style="width:auto" class="wn" value="${x.id}" ${x.c>=wk.min?'checked':''}> ${esc(x.n)} — ${x.c} معتمدة ${x.c>=wk.min?'(متأهل)':''}</label>`).join('')||'مفيش بيانات'}<br><button class="btn" data-a="pub">انشر الأبطال 🏆</button></div>${board()}`}};
const agList=()=>all().filter(a=>(!G.q||a.sname.includes(G.q))&&(!G.s||st(a).includes(G.s))).map(a=>`<div class="card"><b>${esc(a.sname)}</b> · ${esc(a.subject)} ${chip(a)}<br>${esc(a.goal)}<br><small>${fm(a.start)} → ${fm(a.checkin)}</small>${a.afterId?`<div class="row" style="margin-top:6px"><button class="btn s" data-a="go" data-v="rev">مراجعة</button>${locked(a)?`<button class="btn s" data-a="reopen" data-id="${a.id}">إعادة فتح 🔓</button>`:''}</div>`:''}</div>`).join('')||'<div class="card">—</div>';
const stuList=()=>studs().filter(s=>!G.q2||s.n.includes(G.q2)).map(s=>{const a=all().filter(x=>x.sid===s.id);return`<div class="card"><b>${esc(s.n)}</b> · معتمد الأسبوع: ${s.c} · إجمالي الاتفاقات: ${a.length} · معتمد: ${a.filter(apr).length} · جزئي: ${a.filter(x=>!pend(x)&&x.submittedAt&&rv[x.id].decision==='partial').length} · Check-in فايت: ${a.filter(x=>!x.cancelled&&!x.submittedAt&&Date.now()>x.checkin).length}${a.map(x=>`<br><small>• ${esc(x.subject)}: ${esc(x.goal.slice(0,40))} — ${st(x)}${rv[x.id]&&rv[x.id].notes?' — ملاحظة: '+esc(rv[x.id].notes):''}</small>`).join('')}</div>`}).join('')||'<div class="card">—</div>';
async function up(f){if(!AS)throw Error('رفع الصور مش متاح لحسابك دلوقتي');if(!f||!f.type.startsWith('image/'))throw Error('ارفع صورة من نوع JPG أو PNG');if(f.size>15e6)throw Error('الصورة كبيرة قوي (الحد 15MB)');const b=await createImageBitmap(f),k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));const r=await AS.upload(bl);return{id:r.id,at:Date.now()}}
const err=m=>{msg='!'+m;R()};
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='fb'||t.id==='fa'){try{const r=await up(t.files[0]);F[t.id==='fb'?'before':'after']=r}catch(x){msg='!'+(x.message||'فشل الرفع، جرّب تاني')}R()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k)F[t.dataset.k]=t.value;if(t.dataset.f){G[t.dataset.f]=t.value;$('#lst').innerHTML=V==='agr'?agList():stuList()}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,A=ag[id];
try{if(a==='zoom'){$('#lb img').src=t.src;$('#lb').style.display='grid';return}
if(a==='go'){V=t.dataset.v;P=id||null;F={};G={};R()}
else if(a==='vw'){pv=t.dataset.v==='stu';V=pv?'home':'dash';F={};R()}
else if(a==='next'){const s=tms('s'),c=tms('c');if(!(s>Date.now()))return err('اختار ميعاد بداية في المستقبل بتوقيت القاهرة');if(!(c>s))return err('ميعاد المتابعة لازم يكون بعد وقت البداية');if((F.goal||'').trim().length<5)return err('اكتب المهمة اللي هتنجزها (5 حروف على الأقل)');if(!F.before)return err('ارفع سكرين "قبل ما تبدأ" الأول 📸');
if(mine().some(x=>!x.cancelled&&!x.submittedAt&&x.checkin>Date.now()&&x.start<c&&x.checkin>s))return err('عندك اتفاق تاني في نفس الوقت، اختار ميعاد مختلف');F.start=s;F.checkin=c;F.subject=F.subject||SUB[0];F.confirm=1;R()}
else if(a==='back'){F.confirm=0;R()}
else if(a==='save'){const i=crypto.randomUUID();await db.collection('agreements').doc(i).set({sid:me.id,sname:me.name,subject:F.subject,type:'مهمة',lesson:'',goal:F.goal.trim(),start:F.start,checkin:F.checkin,notes:'',beforeId:F.before.id,beforeAt:F.before.at,createdAt:Date.now()});msg='+تم الاتفاق! 🚀 اتفاق جديد، وإنجاز جديد 💜';V='home';P=null;F={};R()}
else if(a==='begin'){if(A&&!A.startedAt&&Date.now()>=A.start){await db.collection('agreements').doc(id).update({startedAt:Date.now()});msg='+اتسجلت بدايتك! بالتوفيق 🚀'}R()}
else if(a==='cancel'){if(A.start>Date.now()){await db.collection('agreements').doc(id).update({cancelled:true});V='mine';R()}}
else if(a==='submit'){if(!F.result)return err('اختار وصلت لفين الأول');if(!F.after)return err('ارفع سكرين "بعد الإنجاز" 🏆');await db.collection('agreements').doc(id).update({result:F.result,snotes:F.snotes||'',afterId:F.after.id,afterAt:F.after.at,submittedAt:Date.now()});msg='+نتيجتك وصلت لمس سارة، مستنيين الاعتماد 💜';V='mine';F={};R()}
else if(a==='dec'){const d=t.dataset.d,n=($('#n'+id)||{}).value||'';if(d==='rejected'&&!n.trim())return err('اكتب سبب الرفض');await db.collection('reviews').doc(id).set({decision:d,notes:n,at:Date.now(),by:me.name});msg='+'+(d==='approved'?'تم اعتماد إنجاز الطالب.':'تم تسجيل قرارك.');R()}
else if(a==='reopen'){await db.collection('reviews').doc(id).set({decision:'reopened',notes:'اتفتح التسليم من جديد',at:Date.now(),by:me.name});R()}
else if(a==='min'){const v=+$('#min').value;if(v>0){await db.doc('weekly/current').set({...wk,min:v});msg='+اتحفظ'}R()}
else if(a==='pub'){const ids=[...document.querySelectorAll('.wn:checked')].map(x=>x.value),w=studs().filter(s=>ids.includes(s.id)).sort((x,y)=>y.c-x.c).map(s=>({n:s.n,c:s.c}));await db.doc('weekly/current').set({...wk,winners:w,pubAt:Date.now()});msg='+تم نشر أبطال الأسبوع 🏆'}
else if(a==='csv'){const rows=[['الطالب','المادة','الهدف','البداية','Check-in','التسليم','الحالة']].concat(all().map(x=>[x.sname,x.subject,x.goal,fm(x.start),fm(x.checkin),fm(x.submittedAt),st(x)]));await DLD.save({filename:'saat-el-hasm.csv',data:'\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')})}
}catch(x){err('حصلت مشكلة: '+(x.message||x.code||'جرّب تاني'))}});
$('#lb').onclick=()=>$('#lb').style.display='none';
setInterval(()=>{const c=$('#cd'),e=$('#el');if(c){const r=+c.dataset.t-Date.now();c.textContent=cd(r);if(r<=0&&c.dataset.k==='s')R()}if(e)e.textContent=cd(Date.now()-+e.dataset.s)},1000);
(async()=>{let step='start';const fail=(w,x)=>{$('#app').innerHTML='<div class="err">'+w+'<br><small dir="ltr">'+esc((x&&(x.message||x.code))||x||'')+'</small></div>'};
try{if(typeof claude==='undefined'||!claude.use)return fail('افتحي الرابط من claude.ai، الصفحة لازم تتفتح جوه المنصة.','no claude runtime');
const g=async n=>{try{return await claude.use(n)}catch(e){return null}};
step='capabilities';const[d,u,as,dl]=await Promise.all([g('db'),g('user'),g('assets'),g('downloads')]);db=d;AS=as;DLD=dl;
if(!d||!u){$('#app').innerHTML='<div class="card">افتح الصفحة من حسابك على Claude عشان تسجّل دخول 💜</div>';return}
step='user';me=await u.me();try{adm=await u.canEdit()}catch(e){adm=false}
if(!me||!me.id)return fail('مقدرناش نعرف حسابك. سجّل دخول على Claude وحدّث الصفحة.','no user id');
V=adm?'dash':'home';$('#who').textContent=me.name;
const live=()=>{const e=document.activeElement;if(V==='checkin'||(e&&/INPUT|TEXTAREA|SELECT/.test(e.tagName)&&$('#app').contains(e)))return;try{R()}catch(x){fail('مشكلة في عرض الصفحة',x)}},er=x=>fail('مشكلة في قاعدة البيانات',x);
step='database';
db.collection('agreements').onSnapshot(q=>{ag={};q.docs.forEach(x=>ag[x.id]={id:x.id,...x.data()});live()},er);
db.collection('reviews').onSnapshot(q=>{rv={};q.docs.forEach(x=>rv[x.id]=x.data());live()},er);
db.doc('weekly/current').onSnapshot(q=>{if(q.exists)wk={min:3,winners:null,...q.data()};live()},er);
step='render';R()}catch(x){fail('حصلت مشكلة وإحنا بنفتح الموقع (المرحلة: '+step+')',x)}})();
